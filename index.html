<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement U17 – Ligue d’Aviron des Pays de la Loire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{--navy:#0b1f3a;--navy2:#143561;--river:#0e8a9a;--river-l:#e3f3f5;--bg:#f3f5f9;--card:#fff;--ink:#14213a;--muted:#647189;--line:#e2e7ee;
--H:#2b7fd4;--H-l:#e7f0fb;--F:#bd4ea9;--F-l:#f8e8f4;--d1:#c9970e;--d1-l:#fcf4dc;--d2:#7f8ca0;--d2-l:#eef1f5;--d3:#b5693a;--d3-l:#f8ebe2;--d4:#4f7397;--d4-l:#e6eef6;--j:#e0892b;--j-l:#fdf0e1;--ok:#1d9a5b;--err:#d33f3f;--acc:var(--H);--acc-l:var(--H-l)}
body.sex-F{--acc:var(--F);--acc-l:var(--F-l)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* export pdf */
.btn-pdf{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 14px;font-weight:600}
.btn-pdf:hover{background:rgba(255,255,255,.18)}
.ovl{position:fixed;inset:0;background:rgba(11,31,58,.45);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:#fff;border-radius:16px;padding:20px 22px;width:min(440px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.flbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);margin:10px 0 6px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.opts label:has(input:checked){border-color:var(--acc);background:var(--acc-l)}
/* header */
.brand{background:#fff;border-bottom:1px solid var(--line)}
.brand .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:10px;padding-bottom:10px}
.brand img{height:46px;width:auto;display:block}
.brand .bt{font-size:13px;color:var(--muted);font-weight:600;text-align:right;line-height:1.3}
.brand .bt b{display:block;color:var(--navy);font-family:"Barlow Condensed";font-size:17px;letter-spacing:.02em}
@media (max-width:600px){.brand img{height:34px}.brand .bt{display:none}}
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 70%,#0e4d6b 100%);color:#fff;position:relative;overflow:hidden}
.hero svg.waves{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:60px;opacity:.18}
.hero .wrap{position:relative;padding-top:22px;padding-bottom:18px}
.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;opacity:.75;font-weight:600}
.hero h1{margin:2px 0 2px;font-size:34px;line-height:1.05;font-weight:700}
.hero h1 span{color:#74c6a6;display:block;font-size:.66em;margin-top:2px}
.sub{opacity:.8;font-size:14px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#fff;padding:7px 16px;border-radius:999px;font-weight:600;opacity:.8}
.seg button.on{opacity:1;background:#fff}
.seg button.on[data-sex=H]{color:var(--H)}.seg button.on[data-sex=F]{color:var(--F)}
.btn-edit{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:7px 14px;font-weight:600}
.btn-edit.on{background:#ffd35c;color:var(--navy);border-color:#ffd35c}
/* timeline */
.tl{display:flex;margin-top:18px;gap:0;align-items:stretch}
.tl .step{flex:1;position:relative;padding-top:16px;min-width:0}
.tl .step:before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:rgba(255,255,255,.22)}
.tl .step:first-child:before{left:7px}.tl .step:last-child:before{right:auto;width:7px}
.tl .dot{position:absolute;top:0;left:0;width:12px;height:12px;border-radius:50%;background:var(--navy);border:2px solid rgba(255,255,255,.5)}
.tl .step.done .dot{background:#7fd6e0;border-color:#7fd6e0}
.tl .step.next .dot{background:#ffd35c;border-color:#ffd35c;box-shadow:0 0 0 4px rgba(255,211,92,.25)}
.tl .step.final .dot{background:#fff;border-color:#fff;width:14px;height:14px;top:-1px}
.tl .lbl{font-size:13px;font-weight:600;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .dt{font-size:12px;opacity:.7}
/* tabs */
.tabsbar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:13px 14px 11px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--acc)}
.tab svg{width:18px;height:18px;flex:none}
.tab .cnt{font-size:11px;background:var(--bg);border-radius:999px;padding:1px 7px;color:var(--muted)}
.tab.on .cnt{background:var(--acc-l);color:var(--acc)}
.tabsep{width:1px;background:var(--line);margin:10px 6px}
main{padding:22px 0 90px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:24px}
.card h3{margin:0 0 8px;font-size:19px}
.muted{color:var(--muted)}
.small{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:"Barlow Condensed";font-size:30px;font-weight:700;line-height:1.1}
.kpi .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.kpi.acc .k,.kpi.acc .s{color:rgba(255,255,255,.85)}
.banner{display:flex;gap:10px;align-items:center;background:var(--j-l);border:1px solid #f3d3ab;color:#7a4a12;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.banner.info{background:var(--river-l);border-color:#bfe3e8;color:#0b5560}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.search{border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:220px;background:#fff}
/* tables */
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}th.c,td.c{text-align:center}
.pos{font-family:"Barlow Condensed";font-weight:700;font-size:20px;width:46px}
.name{font-weight:600}
.club{font-size:12.5px;color:var(--muted)}
.pal{height:18px;width:auto;vertical-align:-4px;margin-right:6px;filter:drop-shadow(0 0 .5px rgba(11,31,58,.25))}
td.club .pal{height:20px;vertical-align:-5px}
.tot{font-family:"Barlow Condensed";font-weight:700;font-size:20px}
.pts{font-weight:600}
.pts small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.dash{color:#b6bfcc}
.ergo-off{color:#a4adbb;text-decoration:line-through;text-decoration-color:#c7cfd9}
.ergo-on{color:var(--river);font-weight:700}
tr.grp td{background:#f7f9fc;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:7px 12px;color:var(--muted)}
tr.grp.d1 td{background:var(--d1-l);color:#8a6806}tr.grp.d2 td{background:var(--d2-l);color:#56637a}tr.grp.d3 td{background:var(--d3-l);color:#8a4a22}tr.grp.d4 td{background:var(--d4-l);color:#36577a}tr.grp.j td{background:var(--j-l);color:#94560f}
.bdg{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.b-d1{background:var(--d1-l);color:#8a6806;border:1px solid #efd88f}
.b-d2{background:var(--d2-l);color:#4d5a70;border:1px solid #d3d9e2}
.b-d3{background:var(--d3-l);color:#8a4a22;border:1px solid #e9c8b2}
.b-d4{background:var(--d4-l);color:#36577a;border:1px solid #c5d6e7}
.b-j{background:var(--j-l);color:#94560f;border:1px solid #f1cf9f}
.b-jk{background:var(--navy);color:#fff}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:"Barlow Condensed";font-weight:700;font-size:16px;color:#fff}
.m1{background:linear-gradient(135deg,#e7bb2c,#b98a07)}.m2{background:linear-gradient(135deg,#b7c0cc,#7f8ca0)}.m3{background:linear-gradient(135deg,#d38a55,#a35a2c)}
.chip{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700;background:var(--river-l);color:var(--river)}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-left:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
/* event header */
.evhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.evicon{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:var(--acc-l);color:var(--acc);flex:none}
.evicon svg{width:32px;height:32px}
.evhead .meta{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.evhead .meta div{text-align:right}
.evhead .meta b{display:block;font-family:"Barlow Condensed";font-size:22px}
.evhead .meta span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* bonus legend */
.tiers{display:flex;gap:6px;flex-wrap:wrap}
.tier{flex:1;min-width:92px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.tier .t{font-size:12.5px;color:var(--muted)}
.tier .p{font-family:"Barlow Condensed";font-size:22px;font-weight:700;color:var(--river)}
.tier .n{font-size:12px;color:var(--muted)}
/* rules */
.pts-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pts-grid div{background:var(--bg);border-radius:8px;padding:6px 8px;display:flex;justify-content:space-between;font-size:14px}
.pts-grid b{font-variant-numeric:tabular-nums}
.rule{display:flex;gap:12px;margin:10px 0}
.rule .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc-l);color:var(--acc);font-weight:700;display:grid;place-items:center;font-family:"Barlow Condensed";font-size:17px}
.formula{background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;font-family:"Barlow Condensed";font-size:20px;letter-spacing:.02em}
.formula em{font-style:normal;color:#7fd6e0}
.btable td,.btable th{padding:6px 10px}
.div-strip{display:flex;border-radius:10px;overflow:hidden;margin-top:8px;font-size:13px;font-weight:600}
.div-strip div{padding:8px 10px;text-align:center}
/* finale */
.divcard{border-radius:14px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.divcard .dh{padding:12px 16px;display:flex;align-items:baseline;justify-content:space-between}
.divcard .dh h3{margin:0;font-size:24px}
.divcard.d1 .dh{background:var(--d1-l)}.divcard.d2 .dh{background:var(--d2-l)}.divcard.d3 .dh{background:var(--d3-l)}.divcard.d4 .dh{background:var(--d4-l)}
.divcard ol{list-style:none;margin:0;padding:6px 0}
.divcard li{display:flex;gap:10px;align-items:center;padding:6px 16px}
.divcard li .p{width:26px;font-family:"Barlow Condensed";font-weight:700;font-size:17px;color:var(--muted)}
.divcard li .nm{flex:1;min-width:0}
.divcard li .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.divcard .sub2{padding:8px 16px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);border-top:1px dashed var(--line)}
.slot{margin:4px 16px;border:1.5px dashed #cfd6e0;border-radius:8px;padding:6px 10px;color:#9aa5b5;font-size:13px}
/* edit */
.editbox{border:2px dashed #ffd35c;background:#fffcf0;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.editbox h3{margin:0 0 6px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#fff}
.inp{border:1px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;width:100%}
.inp.time{width:110px;text-align:right;font-variant-numeric:tabular-nums}
.inp.err{border-color:var(--err);background:#fff3f3}
.inp.ok{border-color:#9fd8bb}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font-weight:600}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--err)}
.btn.danger.arm{background:var(--err);color:#fff;border-color:var(--err)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(11,31,58,.3);transition:transform .25s;z-index:20;font-weight:500}
.savebar.show{transform:translateX(-50%) translateY(0)}
.savebar button{border:0;background:#ffd35c;color:var(--navy);border-radius:999px;padding:8px 16px;font-weight:700}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-90px);background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);border-radius:12px;padding:10px 16px;z-index:30;transition:transform .25s;font-weight:500;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin-top:24px}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.pts-grid{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:27px}.tl .lbl{font-size:11.5px}.tl .dt{font-size:11px}.evhead .meta{margin-left:0}.evhead .meta div{text-align:left}}
@media (max-width:520px){.tl .lbl{white-space:normal}.pts-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

var PAL_ALIAS={MSA:"LMSA",CLL:"CLLN",SNOSA:"SNOS",AVIRON85:"A85",LAVAL:"CNL",SAUMUR:"SNSA"};
function palKey(club){ var t=String(club||"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim().split(" "); for(var i=t.length-1;i>=0;i--){ var k=t[i]; if(PAL[k]) return k; if(PAL_ALIAS[k]) return PAL_ALIAS[k]; } return null; }
function clubH(club){ var k=palKey(club); return (k?'<img class="pal" src="'+PAL[k]+'" alt="" title="Palette '+k+'">':'')+esc(club||""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function uid(){ return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function parseTime(s){
  if(s==null) return null; s=String(s).trim(); if(!s) return null;
  s=s.replace(/,/g,".").replace(/[’'′]/g,":").replace(/["″]/g,".").replace(/\s+/g,"").replace(/[hH]/g,":").replace(/\.$/,"").replace(/:$/,"");
  if(s.indexOf(":")<0 && (s.match(/\./g)||[]).length===2){ s=s.replace(".",":"); }
  if(!/^[0-9:.]+$/.test(s)) return NaN;
  var parts=s.split(":"); var tot=0;
  for(var i=0;i<parts.length;i++){ if(parts[i]==="") return NaN; var v=parseFloat(parts[i]); if(isNaN(v)) return NaN; if(i>0 && v>=60) return NaN; if(i<parts.length-1 && parts[i].indexOf(".")>=0) return NaN; tot=tot*60+v; }
  if(tot<=0 || tot>4*3600) return NaN;
  return Math.round(tot*10)/10;
}
function fmt(sec){
  if(typeof sec!=="number"||isNaN(sec)) return "";
  var t=Math.round(sec*10), h=Math.floor(t/36000), m=Math.floor((t%36000)/600), s=Math.floor((t%600)/10), d=t%10;
  return (h? h+"h"+String(m).padStart(2,"0") : m)+"'"+String(s).padStart(2,"0")+'"'+d;
}
function fmtGap(sec){ return "+"+(sec<60? (Math.round(sec*10)/10).toFixed(1)+"s" : fmt(sec)); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function daysTo(iso){ var a=new Date(today()+"T00:00:00"), b=new Date(iso+"T00:00:00"); return Math.round((b-a)/86400000); }
function ord(n){ return n===1?"1er":n+"e"; }

/* ---------- calculs ---------- */
function athletesOf(sex){ return S.athletes.filter(function(a){return a.sexe===sex;}); }
function rt(v){ return v==null ? null : (typeof v==="number" ? v : (typeof v.t==="number" ? v.t : null)); }
function eventCount(evId,sex){ var r=S.results[evId]; return athletesOf(sex).filter(function(a){return rt(r[a.id])!==null;}).length; }
function eventRank(evId,sex){
  var ev=EV[evId], res=S.results[evId];
  var rows=athletesOf(sex).filter(function(a){return rt(res[a.id])!==null;}).map(function(a){var v=res[a.id]; return {a:a,t:rt(v),v:(typeof v==="object"?v:{})};});
  var dns=athletesOf(sex).filter(function(a){var v=res[a.id]; return v && typeof v==="object" && (v.dns||v.dnf);}).map(function(a){return {a:a,v:res[a.id]};});
  rows.sort(function(x,y){return (x.v.place||1e9)-(y.v.place||1e9) || x.t-y.t || x.a.nom.localeCompare(y.a.nom);});
  var best=rows.length?Math.min.apply(null,rows.map(function(r){return r.t;})):0, by={};
  rows.forEach(function(r,i){
    r.rank= r.v.place ? r.v.place : ((i>0 && r.t===rows[i-1].t)? rows[i-1].rank : i+1);
    r.gap= typeof r.v.gap==="number" ? r.v.gap : r.t-best;
    r.pct= typeof r.v.pct==="number" ? r.v.pct : null;
    r.pp=placePts(r.rank);
    r.bonus= ev.type==="ergo" ? bonus(r.t,sex) : 0;
    r.tier= ev.type==="ergo" ? tierIdx(r.t,sex) : -1;
    r.total=r.pp+r.bonus; by[r.a.id]=r;
  });
  return {rows:rows, by:by, best:best, dns:dns};
}
function divOf(pos){ var k=Math.floor((pos-1)/12), r=(pos-1)%12; return r<10 ? {code:"D"+(k+1), cls:"d"+Math.min(k+1,4), joker:false, n:k+1} : {code:"J"+(k+1), cls:"j", joker:true, n:k+1}; }
/* Classement ergo : meilleure perf des 2 tests -> rang -> points place ; bonus pour CHAQUE perf (indoor + février) */
function ergoRank(sex){
  var r1=S.results.ergo1, r2=S.results.ergo2;
  var rows=athletesOf(sex).map(function(a){
    var t1=rt(r1[a.id]), t2=rt(r2[a.id]);
    if(t1===null&&t2===null) return null;
    var src = t2===null ? "ergo1" : (t1===null ? "ergo2" : (t2<t1?"ergo2":"ergo1"));
    return {a:a, t:src==="ergo1"?t1:t2, src:src, t1:t1, t2:t2};
  }).filter(Boolean);
  rows.sort(function(x,y){return x.t-y.t || x.a.nom.localeCompare(y.a.nom);});
  var best=rows.length?rows[0].t:0, by={};
  rows.forEach(function(r,i){
    r.rank=(i>0 && r.t===rows[i-1].t)? rows[i-1].rank : i+1;
    r.gap=r.t-best; r.pp=placePts(r.rank); r.tier=tierIdx(r.t,sex);
    r.b1=r.t1===null?0:bonus(r.t1,sex); r.b2=r.t2===null?0:bonus(r.t2,sex); r.bonus=r.b1+r.b2;
    r.total=r.pp+r.bonus; by[r.a.id]=r;
  });
  return {rows:rows, by:by, best:best};
}
function general(sex){
  var ER={}; EVENTS.forEach(function(e){ ER[e.id]=eventRank(e.id,sex); });
  var EG=ergoRank(sex);
  var list=athletesOf(sex).map(function(a){
    var g={a:a, ev:{}}; EVENTS.forEach(function(e){ g.ev[e.id]=ER[e.id].by[a.id]||null; });
    g.ergo=EG.by[a.id]||null;
    g.ergoPts = g.ergo ? g.ergo.total : 0;
    g.skiff=(g.ev.tdr1?g.ev.tdr1.total:0)+(g.ev.tdr2?g.ev.tdr2.total:0);
    g.nSkiff=(g.ev.tdr1?1:0)+(g.ev.tdr2?1:0);
    g.skiffT=(g.ev.tdr1?g.ev.tdr1.t:0)+(g.ev.tdr2?g.ev.tdr2.t:0);
    g.total=g.skiff+g.ergoPts;
    g.n=EVENTS.filter(function(e){return g.ev[e.id];}).length;
    return g;
  }).filter(function(g){return g.n>0;});
  /* égalité : le plus rapide en skiff (temps moyen des têtes de rivière courues ; sans TdR = derrière) */
  function avgT(g){ return g.nSkiff ? g.skiffT/g.nSkiff : Infinity; }
  list.sort(function(x,y){ return y.total-x.total || (avgT(x)-avgT(y)) || x.a.nom.localeCompare(y.a.nom); });
  list.forEach(function(g,i){ g.pos=i+1; g.div=divOf(g.pos); });
  return {list:list, ER:ER, EG:EG};
}

/* ---------- rendu ---------- */
var app=document.getElementById("app");
function tabsDef(){
  var t=[{id:"general",label:"Classement général",icon:"list"}];
  EVENTS.forEach(function(e){ t.push({id:e.slug,label:e.short,icon:e.type,emoji:e.emoji,ev:e.id}); });
  t.push({id:"ergo",label:"Classement ergo",icon:"ergo"});
  t.push({sep:true});
  t.push({id:"reglement",label:"Règlement",icon:"book"});
  t.push({id:"finale",label:"Divisions",icon:"trophy"});
  if(ui.edit) t.push({id:"athletes",label:"Athlètes",icon:"users"});
  return t;
}
function render(){
  document.body.className="sex-"+ui.sex;
  var valid=tabsDef().some(function(t){return t.id===ui.tab;}); if(!valid) ui.tab="general";
  app.innerHTML = renderHero()+renderTabs()+'<main><div class="wrap" id="view">'+renderView()+'</div></main>';
  updateSaveBar();
}
function renderHero(){
  var td=today(), nextFound=false;
  var steps=EVENTS.map(function(e){
    var done=eventCount(e.id,"H")+eventCount(e.id,"F")>0, cls=done?"done":"";
    if(!done && !nextFound && e.date>=td){ cls="next"; nextFound=true; }
    return '<div class="step '+cls+'"><span class="dot"></span><div class="lbl">'+(e.emoji?e.emoji+" ":"")+esc(e.short)+'</div><div class="dt">'+e.label+'</div></div>';
  }).join("");
  steps+='<div class="step final '+(!nextFound?"next":"")+'"><span class="dot"></span><div class="lbl">🏁 Chpt Régional U17 skiff</div><div class="dt">'+FINALE.label+'</div></div>';
  return '<div class="brand"><div class="wrap"><img src="'+LOGO+'" alt="Ligue d’Aviron des Pays de la Loire"><div class="bt"><b>Classement U17</b>Saison 2026-2027</div></div></div><header class="hero"><svg class="waves" viewBox="0 0 1200 60" preserveAspectRatio="none"><path d="M0 30 Q150 0 300 30 T600 30 T900 30 T1200 30 V60 H0Z" fill="#fff"/><path d="M0 42 Q150 15 300 42 T600 42 T900 42 T1200 42 V60 H0Z" fill="#fff" opacity=".6"/></svg><div class="wrap">'+
    '<div class="toprow"><div><div class="kicker">Aviron · Saison 2026-2027</div><h1>Classement U17 <span>Ligue d’Aviron des Pays de la Loire</span></h1><div class="sub">Qualification pour le Championnat Régional U17 en skiff du '+FINALE.label+'</div></div>'+
    '<div class="controls"><div class="seg"><button data-act="sex" data-sex="H" class="'+(ui.sex==="H"?"on":"")+'">Hommes</button><button data-act="sex" data-sex="F" class="'+(ui.sex==="F"?"on":"")+'">Femmes</button></div>'+((DL||!IN_CLAUDE)?'<button class="btn-pdf" data-act="pdf">📄 Export PDF</button>':'')+'</div></div>'+
    '<div class="tl">'+steps+'</div></div></header>';
}
function renderTabs(){
  return '<nav class="tabsbar"><div class="wrap tabs">'+tabsDef().map(function(t){
    if(t.sep) return '<span class="tabsep"></span>';
    var cnt = t.ev ? '<span class="cnt">'+eventCount(t.ev,ui.sex)+'</span>' : "";
    return '<button class="tab '+(ui.tab===t.id?"on":"")+'" data-act="tab" data-tab="'+t.id+'">'+(t.emoji?'<span style="font-size:17px;line-height:1">'+t.emoji+'</span>':IC[t.icon])+esc(t.label)+cnt+'</button>';
  }).join("")+'</div></nav>';
}
function renderView(){
  if(ui.tab==="general") return viewGeneral();
  if(ui.tab==="finale") return viewFinale();
  if(ui.tab==="reglement") return viewRules();
  if(ui.tab==="athletes") return viewAthletes();
  if(ui.tab==="ergo") return viewErgo();
  var ev=EVENTS.filter(function(e){return e.slug===ui.tab;})[0];
  return ev ? viewEvent(ev) : viewGeneral();
}
function sexWord(){ return ui.sex==="H"?"Hommes":"Femmes"; }
function doneCount(){ return EVENTS.filter(function(e){return eventCount(e.id,ui.sex)>0;}).length; }

function viewGeneral(){
  var G=general(ui.sex), list=G.list, dc=doneCount();
  var td=today(), next=EVENTS.filter(function(e){return eventCount(e.id,ui.sex)===0 && e.date>=td;})[0];
  var nd = next ? daysTo(next.date) : daysTo(FINALE.date);
  var leader=list[0];
  var h='<div class="kpis">'+
    '<div class="kpi acc"><div class="k">Leader '+sexWord()+'</div><div class="v">'+(leader?leader.total+" pts":"—")+'</div><div class="s">'+(leader?esc(leader.a.nom)+(leader.a.club?" · "+esc(leader.a.club):""):"En attente des premiers résultats")+'</div></div>'+
    '<div class="kpi"><div class="k">Athlètes classés</div><div class="v num">'+list.length+'</div><div class="s">'+sexWord()+' U17</div></div>'+
    '<div class="kpi"><div class="k">Épreuves disputées</div><div class="v num">'+dc+' / 4</div><div class="s">'+(dc===4?"Classement définitif":"Classement provisoire")+'</div></div>'+
    '<div class="kpi"><div class="k">Prochaine échéance</div><div class="v num">'+(nd<=0? (nd===0?"Aujourd'hui":"—") : "J-"+nd)+'</div><div class="s">'+(next?esc(next.name):"Championnat Régional U17 en skiff · "+FINALE.label)+'</div></div></div>';
  if(dc<4 && list.length) h+='<div class="banner">⏳ <div><b>Classement provisoire</b> — établi sur '+dc+' épreuve'+(dc>1?"s":"")+' sur 4. Il évoluera jusqu\'à l\'Ergo Février.</div></div>';
  h+='<div class="sectionhead"><div><h2 class="cond" style="margin:0;font-size:26px">Classement général · '+sexWord()+'</h2><div class="muted small">Total = TdR Angers + TdR Nantes + Classement ergo (points place sur la meilleure perf + bonus de chaque perf)</div></div>'+
     '<input class="search" id="q" placeholder="Rechercher un athlète ou un club…" value="'+esc(ui.q)+'"></div>';
  if(!list.length) return h+emptyBox("Aucun résultat saisi pour les "+sexWord().toLowerCase()+" pour l'instant.", ui.edit?"Ouvrez l'onglet d'une épreuve pour coller les résultats.":"Les résultats apparaîtront ici après la Tête de rivière d'Angers.");
  var q=norm(ui.q), lastGrp=null;
  var rows=list.map(function(g){
    var out="";
    if(q && norm(g.a.nom+" "+(g.a.club||"")).indexOf(q)<0) return "";
    var cells=["tdr1","tdr2"].map(function(k){
      var r=g.ev[k]; if(!r) return '<td class="r"><span class="dash">—</span></td>';
      return '<td class="r pts num">'+r.total+'<small>'+ord(r.rank)+' · '+fmt(r.t)+'</small></td>';
    }).join("") + (g.ergo ? '<td class="r pts num"><span class="ergo-on">'+g.ergo.total+'</span><small>'+ord(g.ergo.rank)+' · '+fmt(g.ergo.t)+' · +'+g.ergo.bonus+' bonus</small></td>' : '<td class="r"><span class="dash">—</span></td>');
    return out+'<tr><td class="pos num">'+g.pos+'</td><td><div class="name">'+esc(g.a.nom)+'</div><div class="club">'+clubH(g.a.club)+'</div></td>'+cells+
      '<td class="r tot num">'+g.total+'</td></tr>';
  }).join("");
  h+='<div class="tblwrap"><table><thead><tr><th>#</th><th>Athlète</th><th class="r">🚣 TdR Angers</th><th class="r">🚣 TdR Nantes</th><th class="r">Ergo · meilleure perf</th><th class="r">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  h+='<p class="muted small" style="margin-top:10px">Colonne ergo : points de place du Classement ergo (meilleure performance des deux tests) + bonus de chaque performance ergo. Départage à égalité de points : le plus rapide en skiff (temps moyen des deux têtes de rivière).</p>';
  return h;
}
function divBadge(g){
  if(g.a.joker) return '<span class="bdg b-jk" title="Joker désigné">Joker '+esc(g.a.joker)+'</span>';
  if(g.div.joker) return '<span class="bdg b-j" title="Places 11-12 de chaque bloc : candidats joker">Zone joker</span>';
  return '<span class="bdg b-'+g.div.cls+'">'+g.div.code+'</span>';
}
function emptyBox(t,s){ return '<div class="card empty">'+IC.skiff+'<div style="font-weight:600;color:var(--ink)">'+t+'</div><div class="small">'+s+'</div></div>'; }

function viewEvent(ev){
  var R=eventRank(ev.id,ui.sex), rows=R.rows, isErgo=ev.type==="ergo";
  var h='<div class="card"><div class="evhead"><div class="evicon">'+(ev.emoji?'<span style="font-size:32px;line-height:1">'+ev.emoji+'</span>':IC[ev.type])+'</div><div><div class="muted small" style="text-transform:uppercase;letter-spacing:.08em;font-weight:600">'+(isErgo?"Épreuve ergomètre":"Épreuve skiff")+' · '+ev.label+'</div><h2 class="cond">'+esc(ev.name)+' · '+sexWord()+'</h2>'+
    '<div class="muted small">'+(isErgo?"Le bonus chrono de cette séance est acquis. Les points de place sont attribués dans le Classement ergo, sur la meilleure performance des deux tests.":"Points de place selon le barème. Compte intégralement au classement général.")+'</div></div>'+
    '<div class="meta"><div><b class="num">'+rows.length+'</b><span>Classés</span></div><div><b class="num">'+(rows.length?fmt(R.best):"—")+'</b><span>Meilleur temps</span></div>'+
    '</div></div></div>';
  if(ui.edit) h+=editEventBox(ev);
  if(isErgo) h+=bonusLegend(rows);
  h+='<div id="evRank">'+eventTable(ev,R)+'</div>';
  return h;
}
function eventTable(ev,R){
  var rows=R.rows, isErgo=ev.type==="ergo", EGby=isErgo?ergoRank(ui.sex).by:{};
  if(!rows.length) return emptyBox("Pas encore de résultats pour cette épreuve.", "Date de l'épreuve : "+ev.label+".");
  function who(a){ return '<td><div class="name">'+esc(a.nom)+(a.cat?' <span class="club" style="font-weight:500">· '+esc(a.cat)+'</span>':'')+'</div></td><td class="club" style="font-size:13.5px;white-space:nowrap">'+clubH(a.club)+'</td>'; }
  var body=rows.map(function(r){
    var p = r.rank<=3 ? '<span class="medal m'+r.rank+'">'+r.rank+'</span>' : r.rank;
    return '<tr><td class="pos num">'+p+'</td>'+who(r.a)+
      '<td class="r num" style="font-weight:600">'+fmt(r.t)+'</td>'+
      '<td class="r num muted">'+(r.gap>0?fmtGap(r.gap):'')+'</td>'+
      (isErgo ? '<td class="r"><span class="chip">'+TIERS[ui.sex][r.tier].l+' · +'+r.bonus+'</span></td><td class="c">'+(EGby[r.a.id]&&EGby[r.a.id].src===ev.id?'<span class="bdg b-d4">✓ Meilleure perf</span>':'<span class="dash">—</span>')+'</td></tr>'
              : '<td class="r num">'+(r.pct!==null?r.pct.toFixed(2).replace(".",",")+' %':'<span class="dash">—</span>')+'</td><td class="r tot num">'+r.total+'</td></tr>');
  }).join("");
  body+=(R.dns||[]).map(function(d){ return '<tr style="opacity:.6"><td class="pos num">–</td>'+who(d.a)+'<td class="r small" colspan="4">'+(d.v.dnf?"DNF":"DNS")+' · non classé</td></tr>'; }).join("");
  return '<div class="tblwrap"><table><thead><tr><th>Place</th><th>Athlète</th><th>Club</th><th class="r">Temps</th><th class="r">Écart</th>'+(isErgo?'<th class="r">Tranche bonus</th><th class="c">Meilleure perf</th>':'<th class="r">%</th><th class="r">Points</th>')+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    (isErgo?'':'<p class="muted small" style="margin-top:10px">Temps, écart et % tels que publiés dans les résultats officiels. Points = barème de place du classement.</p>');
}
function viewErgo(){
  var E=ergoRank(ui.sex), rows=E.rows;
  var h='<div class="card"><div class="evhead"><div class="evicon">'+IC.ergo+'</div><div><div class="muted small" style="text-transform:uppercase;letter-spacing:.08em;font-weight:600">Chpt Régional Indoor + Ergo Février</div><h2 class="cond">Classement ergo · '+sexWord()+'</h2>'+
    '<div class="muted small">Chaque athlète est classé sur sa meilleure performance des deux tests. Points = points de place + bonus obtenu à chaque test.</div></div>'+
    '<div class="meta"><div><b class="num">'+rows.length+'</b><span>Classés</span></div><div><b class="num">'+(rows.length?fmt(E.best):"—")+'</b><span>Meilleur temps</span></div></div></div></div>';
  if(!rows.length) return h+emptyBox("Pas encore de performance ergo.","Le classement se remplira après le Championnat régional indoor du 6 décembre.");
  var body=rows.map(function(r){
    var p = r.rank<=3 ? '<span class="medal m'+r.rank+'">'+r.rank+'</span>' : r.rank;
    function tc(t,k){ return t===null?'<span class="dash">—</span>':'<span class="'+(r.src===k?"ergo-on":"ergo-off")+'">'+fmt(t)+'</span>'; }
    return '<tr><td class="pos num">'+p+'</td><td><div class="name">'+esc(r.a.nom)+'</div><div class="club">'+clubH(r.a.club)+'</div></td>'+
      '<td class="r num" style="font-weight:600">'+fmt(r.t)+(r.rank>1?'<div class="club">'+fmtGap(r.gap)+'</div>':'')+'</td>'+
      '<td class="r num">'+tc(r.t1,"ergo1")+'</td><td class="r num">'+tc(r.t2,"ergo2")+'</td>'+
      '<td class="r num">'+r.pp+'</td><td class="r">'+(r.t1===null?'<span class="dash">—</span>':'<span class="chip">+'+r.b1+'</span>')+'</td><td class="r">'+(r.t2===null?'<span class="dash">—</span>':'<span class="chip">+'+r.b2+'</span>')+'</td><td class="r tot num">'+r.total+'</td></tr>';
  }).join("");
  return h+'<div class="tblwrap"><table><thead><tr><th>Rang</th><th>Athlète</th><th class="r">Meilleure perf</th><th class="r">Chpt Régional Indoor</th><th class="r">Ergo Février</th><th class="r">Pts place</th><th class="r">Bonus Indoor</th><th class="r">Bonus Février</th><th class="r">Points</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
function bonusLegend(rows){
  var counts=TIERS[ui.sex].map(function(){return 0;}); rows.forEach(function(r){counts[r.tier]++;});
  return '<div class="card"><h3 class="cond">Bonus chrono brut · '+sexWord()+'</h3><div class="tiers">'+TIERS[ui.sex].map(function(t,i){
    return '<div class="tier"><div class="t num">'+t.l+'</div><div class="p">+'+t.p+'</div><div class="n">'+counts[i]+' athlète'+(counts[i]>1?"s":"")+'</div></div>';
  }).join("")+'</div></div>';
}
function editEventBox(ev){
  var res=S.results[ev.id], ath=athletesOf(ui.sex).slice().sort(function(a,b){return a.nom.localeCompare(b.nom);});
  var inputs=ath.map(function(a){ var t=res[a.id];
    return '<tr><td><div class="name">'+esc(a.nom)+'</div><div class="club">'+clubH(a.club)+'</div></td><td class="r"><input class="inp time '+(typeof t==="number"?"ok":"")+'" data-time="'+a.id+'" data-ev="'+ev.id+'" value="'+(typeof t==="number"?fmt(t):"")+'" placeholder="m\'ss&quot;d"></td></tr>';
  }).join("");
  return '<div class="editbox"><h3 class="cond">✎ Saisie des résultats · '+esc(ev.short)+' · '+sexWord()+'</h3>'+
    '<div class="grid2"><div><div class="small muted" style="margin-bottom:6px">Collez une ligne par athlète depuis un tableur : <b>Nom Prénom ; Club ; Temps</b> (séparateur tabulation ou point-virgule). Formats de temps acceptés : 6\'32"4 · 6:32.4 · 6.32.4 · 18:05,2. Les athlètes inconnus sont créés automatiquement ('+sexWord().toLowerCase()+').</div>'+
    '<textarea id="bulk" placeholder="DUPONT Léa;AC Angers;7:41.2&#10;MARTIN Zoé;Nantes AC;7:38.9"></textarea>'+
    '<div class="row" style="margin-top:8px"><button class="btn pri" data-act="bulk" data-ev="'+ev.id+'">Importer les résultats</button><button class="btn danger" data-act="clearev" data-ev="'+ev.id+'">Effacer les résultats '+sexWord().toLowerCase()+'</button></div></div>'+
    '<div><div class="small muted" style="margin-bottom:6px">Ou saisie / correction individuelle (laisser vide = absent) :</div><div class="tblwrap" style="max-height:300px;overflow:auto"><table><tbody>'+(inputs||'<tr><td class="muted small">Aucun athlète '+sexWord().toLowerCase()+' enregistré. Utilisez l\'import ci-contre.</td></tr>')+'</tbody></table></div></div></div></div>';
}

function buildDivisions(list){
  var pool=list.slice(), divs=[], k=0;
  while(pool.length){
    k++; var code="D"+k;
    var jk=pool.filter(function(g){return g.a.joker===code;}).slice(0,2);
    pool=pool.filter(function(g){return jk.indexOf(g)<0;});
    var sure=pool.slice(0,10); pool=pool.slice(10);
    divs.push({n:k, sure:sure, jk:jk});
  }
  return divs;
}
function viewFinale(){
  var G=general(ui.sex), list=G.list, dc=doneCount();
  var h='<div class="sectionhead"><div><h2 class="cond" style="margin:0;font-size:26px">Championnat Régional U17 en skiff · '+FINALE.label+' · '+sexWord()+'</h2><div class="muted small">Chaque division : 10 qualifiés au classement général + 2 jokers montés de la division inférieure sur décision de la Ligue d’Aviron des Pays de la Loire.</div></div></div>';
  if(dc<4) h+='<div class="banner">⏳ <div><b>Projection</b> sur la base du classement provisoire ('+dc+'/4 épreuves). Les divisions définitives seront arrêtées après l\'Ergo Février.</div></div>';
  if(!list.length) return h+emptyBox("Aucun athlète classé pour l'instant.","Les divisions se rempliront au fil des épreuves.");
  var divs=buildDivisions(list), cards="";
  divs.forEach(function(d){
    var cls="d"+Math.min(d.n,4), last=d.n===divs.length;
    var li=d.sure.map(function(g){return finLi(g);}).join("");
    var jl=d.jk.map(function(g){return finLi(g,"↑ de D"+(d.n+1));}).join("");
    if(!last) for(var s=d.jk.length;s<2;s++) jl+='<div class="slot">Place '+(11+s)+' · joker à désigner par la Ligue d’Aviron des Pays de la Loire (parmi la Division '+(d.n+1)+')</div>';
    cards+='<div class="divcard '+cls+'"><div class="dh"><h3 class="cond">Division '+d.n+'</h3><span class="muted small">'+(d.sure.length+d.jk.length)+' / 12 bateaux</span></div>'+
      '<div class="sub2" style="border-top:0">Qualifiés au classement</div><ol>'+(li||'<li class="muted small">—</li>')+'</ol>'+
      (last && !d.jk.length ? '' : '<div class="sub2">Jokers · montent de la Division '+(d.n+1)+' ('+d.jk.length+'/2)</div><ol>'+jl+'</ol>')+'</div>';
  });
  h+='<div class="grid3">'+cards+'</div>';
  h+='<p class="muted small">Les 10 premiers sont qualifiés en Division 1. Les places 11 et 12 de chaque division sont attribuées par la Ligue d’Aviron des Pays de la Loire à deux rameurs de la division inférieure (jokers). Un joker qui monte libère sa place : la division qu\'il quitte est complétée par le suivant au classement.</p>';
  return h;
}
function finLi(g,jkLabel){
  return '<li><span class="p num">'+g.pos+'</span><span class="nm"><div class="name">'+esc(g.a.nom)+'</div><div class="club">'+clubH(g.a.club)+'</div></span>'+(jkLabel?'<span class="bdg b-jk">'+jkLabel+'</span>':'<span class="pts num">'+g.total+'</span>')+'</li>';
}
function jokerOpts(cur){ var o='<option value="">'+(cur?"Retirer joker":"Joker ?")+'</option>'; for(var k=1;k<=6;k++) o+='<option value="D'+k+'" '+(cur==="D"+k?"selected":"")+'>Joker D'+k+'</option>'; return o; }

function viewRules(){
  var pts=PLACE.map(function(p,i){return '<div><span>'+ord(i+1)+'</span><b>'+p+'</b></div>';}).join("");

function findOrCreate(nom,club,sex){

function splitLine(line){ var f = line.indexOf("\t")>=0 ? line.split("\t") : line.split(";"); if(f.length===1) f=line.split(/\s{2,}/); return f.map(function(x){return x.trim();}).filter(function(x){return x!=="";}); }
function bulkImport(evId){
  var txt=(document.getElementById("bulk")||{}).value||""; var ok=0,cr=0,bad=[];
  txt.split(/\r?\n/).forEach(function(line,i){
    if(!line.trim()) return; var f=splitLine(line);
    if(f.length<2){ bad.push(i+1); return; }
    var t=parseTime(f[f.length-1]);
    if(typeof t!=="number"||isNaN(t)){ bad.push(i+1); return; }
    var nom=f[0], club=f.slice(1,-1).join(" ");
    if(/^\d+$/.test(nom) && f.length>=3){ nom=f[1]; club=f.slice(2,-1).join(" "); }
    var r=findOrCreate(nom,club,ui.sex); if(r.created) cr++;
    S.results[evId][r.a.id]=t; ok++;
  });
  markDirty(); render();
  toast("✓ "+ok+" résultat"+(ok>1?"s":"")+" importé"+(ok>1?"s":"")+(cr?" · "+cr+" athlète"+(cr>1?"s":"")+" créé"+(cr>1?"s":""):"")+(bad.length?" · lignes ignorées : "+bad.slice(0,8).join(", ")+(bad.length>8?"…":""):""));
}
